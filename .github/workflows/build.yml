name: Validate Andertrack UI

on:
  pull_request:
    branches: [main, 'migration/**', 'feature/**']
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Regression tests
        run: npm test
      - name: Main dashboard build
        run: npm run build
      - name: Install driver app dependencies
        run: npm install --prefix apps/driver --no-audit --no-fund
      - name: Driver app unit tests
        run: npm --prefix apps/driver test
      - name: Driver app production build
        run: npm --prefix apps/driver run build

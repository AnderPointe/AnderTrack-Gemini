name: Validate Andertrack UI

on:
  pull_request:
    branches: [main, 'migration/**', 'feature/**']
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/driver/package-lock.json
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Check website dependency advisories
        run: npm audit --audit-level=high
      - name: Regression tests
        run: npm test
      - name: Main dashboard build
        run: npm run build
      - name: Install driver app dependencies
        run: npm ci --prefix apps/driver --no-audit --no-fund
      - name: Check driver dependency advisories
        run: npm audit --prefix apps/driver --audit-level=high
      - name: Driver app unit tests
        run: npm --prefix apps/driver test
      - name: Driver app production build
        run: npm --prefix apps/driver run build
